<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>EDF 4.1</title>

  <!-- Styles -->
  <link rel="stylesheet" href="edf-hud.css?v=28">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest"/>
  <meta name="theme-color" content="#0a0d0a"/>

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="EDF 4.1"/>
  <link rel="apple-touch-icon" href="./icon-180.png"/>
</head>
<body class="menu-page">

  <div class="fx-backdrop" aria-hidden="true">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="radar" id="radar"><div class="sweep"></div></div>
    <div class="alertwash"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <div class="hud-controls">
    <button id="fx-toggle" class="ctrl-btn" type="button" aria-pressed="true" title="Background effects">FX</button>
    <button id="snd-toggle" class="ctrl-btn" type="button" aria-pressed="true" title="Interface sound">SND</button>
  </div>

  <main class="menu">
    <div class="titleblock">
      <h1>EDF 4.1</h1>
      <div class="subtitle">The Shadow of New Despair</div>
    </div>

    <a class="btn" href="Ranger.html">Ranger <span class="tag" data-progress></span></a>
    <a class="btn" href="Wingdiver.html">Wing Diver <span class="tag" data-progress></span></a>
    <a class="btn" href="AirRaider.html">Air Raider <span class="tag" data-progress></span></a>
    <a class="btn" href="Fencer.html">Fencer <span class="tag" data-progress></span></a>

    <div class="utilrow">
      <button class="btn util" id="export-btn" type="button">Export Progress</button>
      <button class="btn util" id="import-btn" type="button">Import Progress</button>
      <input id="import-file" type="file" accept="application/json" hidden>
    </div>

    <!-- Version lives here as a literal rather than being injected by script, so
         it still shows if Main.js fails. Bump it here and in README.md. -->
    <footer class="appfooter">
      <span class="version">v2.0.0</span>
      <span class="sep" aria-hidden="true">·</span>
      Built with <a href="https://claude.com/claude-code" target="_blank" rel="noopener noreferrer">Claude Code</a>
    </footer>
  </main>

  <!-- Scripts -->
  <script src="Main.js?v=27" defer></script>

  <!-- Weapon data, loaded only for its category totals so the menu can show a
       class's progress before that class has ever been opened. Main.js is
       deferred too and comes first, so its createEDFPage() stand-in is defined
       by the time these run. Modules, so their top-level consts don't collide. -->
  <script type="module" src="Ranger.js"></script>
  <script type="module" src="Wingdiver.js"></script>
  <script type="module" src="AirRaider.js"></script>
  <script type="module" src="Fencer.js"></script>

  <script src="sw-register.js?v=26" defer></script>
</body>
</html>
